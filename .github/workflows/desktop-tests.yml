name: Desktop tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Python / Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-tk python3-gi libportaudio2 gir1.2-ayatanaappindicator3-0.1 xvfb dbus-x11
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run Python tests under a virtual desktop
        run: dbus-run-session -- xvfb-run -a env PYSTRAY_BACKEND=appindicator .venv/bin/python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: bash -n run-linux.sh scripts/setup-linux.sh scripts/install-linux.sh scripts/build-overlay-linux.sh

  windows:
    name: Python / Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
