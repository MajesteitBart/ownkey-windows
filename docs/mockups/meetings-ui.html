<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ownkey Meetings — interface mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────
 * Ownkey Meetings — design tokens
 * Grammar from Beautiful UI (beautifului.dev): an ink ramp,
 * solid hairline borders, layered shadows, tight radii
 * (chip 6 · control 8 · card 10 · window 14 · pill), strong
 * easing, one accent used as a condiment.
 * Palette from the Ownkey brand book: Keycap Black, Graphite,
 * Slate, Bone, Ash, and Signal Orange as the one accent that
 * means voice / AI / active. Amber warns, green confirms,
 * red errors. JetBrains Mono for anything that reads as a spec.
 * ────────────────────────────────────────────────────────── */
:root, .dark {
  --canvas: #0A0A0A;
  --page: #0E0E0E;
  --surface: #171717;
  --inset: #121212;
  --hover: #1C1C1C;
  --hover-2: #242424;
  --field: #1A1A1A;

  --ink: #F3F1EC;
  --ink-2: #BDB9AE;
  --ink-3: #8E8A7F;

  --line: #262626;
  --line-strong: #363636;
  --line-soft: #1F1F1F;

  --accent: #DE5F14;
  --accent-ink: #F08A3C;
  --accent-tint: rgba(222, 95, 20, 0.16);
  --amber: #F4A23C;
  --amber-tint: rgba(244, 162, 60, 0.14);
  --green: #9DCB3B;
  --green-tint: rgba(157, 203, 59, 0.14);
  --red: #E2574B;
  --red-tint: rgba(226, 87, 75, 0.14);

  --shadow-hairline: 0 0 0 1px var(--line);
  --shadow-btn: 0 0 0 1px rgba(255,255,255,0.10), 0 1px 2px rgba(0,0,0,0.3);
  --shadow-card: 0 0 0 1px rgba(255,255,255,0.09), 0 1px 2px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.2);
  --shadow-raised: 0 0 0 1px rgba(255,255,255,0.12), 0 2px 10px rgba(0,0,0,0.22);
  --shadow-overlay: 0 0 0 1px rgba(255,255,255,0.14), 0 8px 28px rgba(0,0,0,0.34);
  --shadow-pill: 0 24px 50px -12px rgba(0,0,0,0.9), 0 0 40px -18px rgba(222,95,20,0.55);

  --font-sans: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --font-display: "Bricolage Grotesque", var(--font-sans);

  --radius-chip: 6px;
  --radius-control: 8px;
  --radius-card: 10px;
  --radius-window: 14px;

  --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out-strong: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-link: cubic-bezier(0.16, 1, 0.3, 1);
}

.light {
  --canvas: #E8E5DD;
  --page: #F3F1EC;
  --surface: #FFFFFF;
  --inset: #EEEBE4;
  --hover: #EBE8E1;
  --hover-2: #E1DED5;
  --field: #ECE9E2;

  --ink: #0E0E0E;
  --ink-2: #57544C;
  --ink-3: #8E8A7F;

  --line: #E2DFD7;
  --line-strong: #D0CCC2;
  --line-soft: #ECE9E2;

  --accent: #DE5F14;
  --accent-ink: #B64A0C;
  --accent-tint: rgba(222, 95, 20, 0.12);
  --amber: #C97A12;
  --amber-tint: rgba(244, 162, 60, 0.18);
  --green: #5F8A0D;
  --green-tint: rgba(157, 203, 59, 0.22);
  --red: #C8392D;
  --red-tint: rgba(226, 87, 75, 0.14);

  --shadow-hairline: 0 0 0 1px var(--line);
  --shadow-btn: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-card: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
  --shadow-raised: 0 0 0 1px var(--line), 0 2px 10px rgba(0,0,0,0.08);
  --shadow-overlay: 0 0 0 1px var(--line), 0 8px 28px rgba(0,0,0,0.14);
  --shadow-pill: 0 24px 50px -12px rgba(0,0,0,0.5), 0 0 40px -18px rgba(222,95,20,0.45);
}

/* ── base ─────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; height: 100%; }
body {
  height: 100%;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
  overflow: hidden;
}
::selection { background: var(--accent-tint); color: var(--ink); }
button { font: inherit; color: inherit; background: none; border: 0; letter-spacing: inherit; }
button:not(:disabled), [role="button"], label:has(input), a { cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible { outline: none; }
h1, h2, h3, h4 { text-wrap: balance; font-weight: 600; }
p { text-wrap: pretty; }
svg { display: block; }
.theme-switching *, .theme-switching *::before, .theme-switching *::after { transition: none !important; }

.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ink { color: var(--ink); } .ink-2 { color: var(--ink-2); } .ink-3 { color: var(--ink-3); }
.hidden { display: none !important; }
.fade-up { animation: fade-up 400ms var(--ease-out-strong) both; }
.stack > * + * { margin-top: 12px; }

/* ── mockup chrome (outside the app) ──────────────────── */
.chrome {
  position: fixed; inset: 0 0 auto 0; z-index: 100; height: 48px;
  display: flex; align-items: center; gap: 14px; padding: 0 14px;
  background: var(--canvas); border-bottom: 1px solid var(--line);
}
.chrome-brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.chrome-brand svg { width: 22px; height: 22px; }
.chrome-brand small { font-family: var(--font-mono); font-weight: 400; font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; margin-left: 6px; }
.chrome-screens { display: flex; align-items: center; gap: 1px; min-width: 0; flex: 1; overflow-x: auto; scrollbar-width: none; padding: 0 12px; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%); }
.chrome-screens::-webkit-scrollbar { display: none; }
@media (max-width: 1560px) { .chrome-brand small { display: none; } }
.screen-pill {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px 0 6px; border-radius: 7px;
  font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap;
  transition: background-color 120ms ease-out, color 120ms ease-out;
}
.screen-pill:hover { background: var(--hover); color: var(--ink); }
.screen-pill.is-active { background: var(--hover-2); color: var(--ink); }
.screen-pill .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.screen-pill.is-active .n { color: var(--accent-ink); }
.chrome-right { display: flex; align-items: center; gap: 8px; }
.kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--hover-2); border: 1px solid var(--line-strong); border-bottom-width: 2px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }
.theme-toggle { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; align-items: center; height: 32px; padding: 2px; border-radius: 999px; background: var(--field); box-shadow: var(--shadow-hairline); }
.theme-toggle .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: 28px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-btn); transition: transform 200ms var(--ease-out-strong); }
.theme-toggle button { position: relative; z-index: 1; display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 999px; color: var(--ink-3); }
.theme-toggle button.is-on { color: var(--ink); }
.theme-toggle button svg { width: 13px; height: 13px; }
.dark .theme-toggle .thumb { transform: translateX(28px); }

.stage { position: fixed; inset: 48px 0 40px 0; }
.caption {
  position: fixed; inset: auto 0 0 0; height: 40px; z-index: 100;
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: var(--canvas); border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden;
}
.caption .tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.caption .tag::before { content: ""; width: 14px; height: 1px; background: var(--accent); }
.caption b { color: var(--ink); font-weight: 500; }
.caption .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* ── the app shell (harness grammar) ──────────────────── */
.app { position: relative; display: flex; height: 100%; gap: 0; padding: 10px 10px 10px 0; background: var(--canvas); color: var(--ink); min-width: 1180px; }
.panes { display: flex; min-width: 0; flex: 1; gap: 10px; min-height: 0; }
.pane { position: relative; display: flex; min-width: 0; flex-direction: column; overflow: hidden; border-radius: var(--radius-window); border: 1px solid var(--line); background: var(--page); }
.pane.main { flex: 1; }
.pane.side { width: 360px; flex-shrink: 0; animation: fade-in 300ms ease both; }
.pane.side.wide { width: 420px; }
.pane-head { display: flex; height: 44px; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); }
.pane-head .title { font-size: 13px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.pane-head .acts { display: flex; align-items: center; gap: 2px; }
.pane-body { min-height: 0; flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.pane-body.tight { padding: 0; }
.icon-btn { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 6px; color: var(--ink-3); transition: background-color 100ms ease-out, color 100ms ease-out; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn.is-on { background: var(--hover-2); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }

/* sidebar */
.sidebar { position: relative; display: flex; width: 224px; flex-shrink: 0; flex-direction: column; overflow: hidden; transition: width 280ms var(--ease-link); }
.sidebar.is-collapsed { width: 52px; }
.sidebar-inner { display: flex; width: 224px; flex-shrink: 0; flex-direction: column; min-height: 0; height: 100%; }
.sb-head { position: relative; height: 40px; margin: 0 0 10px; flex-shrink: 0; }
.sb-workspace { position: absolute; left: 8px; top: 4px; display: flex; height: 32px; width: 164px; align-items: center; padding: 0 8px; border-radius: 8px; text-align: left; transition: background-color 100ms, opacity 180ms; }
.sb-workspace:hover { background: var(--hover-2); }
.sb-workspace .logo { display: flex; width: 20px; height: 20px; flex-shrink: 0; align-items: center; justify-content: center; }
.sb-workspace .logo svg { width: 20px; height: 20px; }
.sb-copy { transition: opacity 180ms ease-out, transform 180ms var(--ease-link); }
.sidebar.is-collapsed .sb-copy { opacity: 0; transform: translateX(-8px); pointer-events: none; }
.sb-workspace .name { margin-left: 8px; min-width: 0; flex: 1; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.sb-workspace .chev { margin-left: 4px; color: var(--ink-3); display: flex; }
.sb-workspace .chev svg { width: 14px; height: 14px; }
.sb-collapse { position: absolute; right: 8px; top: 4px; display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 8px; color: var(--ink-3); transition: opacity 180ms, background-color 150ms, color 150ms; }
.sb-collapse:hover { background: var(--hover-2); color: var(--ink); }
.sb-collapse svg { width: 17px; height: 17px; }
.sidebar.is-collapsed .sb-collapse { left: 8px; right: auto; transform: rotate(180deg); }
.sidebar.is-collapsed .sb-workspace { pointer-events: none; opacity: 0; }
.glide { position: relative; display: flex; flex-direction: column; gap: 1px; }
.glide .glide-hl { position: absolute; left: 8px; right: 8px; border-radius: 7px; background: var(--hover-2); opacity: 0; pointer-events: none; transition: top 220ms var(--ease-out-strong), height 220ms var(--ease-out-strong), opacity 150ms ease; }
.sidebar.is-collapsed .glide .glide-hl { right: auto; width: 36px; }
.sb-row { position: relative; z-index: 1; display: flex; height: 32px; width: 208px; margin: 0 8px; align-items: center; padding: 0 8px; border-radius: 8px; text-align: left; transition: width 180ms var(--ease-link), background-color 150ms, transform 150ms; }
.sb-row:active { transform: scale(0.98); }
.sidebar.is-collapsed .sb-row { width: 36px; }
.sb-row.is-active { background: var(--hover-2); }
.glide:hover .sb-row.is-active, .glide:hover .sb-recent.is-active { background: transparent; }
.sb-row .ico { display: flex; width: 20px; height: 20px; flex-shrink: 0; align-items: center; justify-content: center; color: var(--ink-2); }
.sb-row .ico svg { width: 17px; height: 17px; }
.sb-row.is-active .ico { color: var(--ink); }
.sb-row .label { margin-left: 6px; min-width: 0; flex: 1; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.sb-row.is-active .label { color: var(--ink); }
.sb-row .count { margin-right: 4px; flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sb-section { display: flex; align-items: center; height: 32px; margin: 12px 8px 2px; padding: 0 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); gap: 6px; }
.sb-section svg { width: 15px; height: 15px; }
.sb-section .grow { flex: 1; }
.sb-scroll { min-height: 0; flex: 1; overflow-y: auto; scrollbar-width: none; }
.sb-recent { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; height: 44px; width: 208px; margin: 0 8px; padding: 0 8px; border-radius: 8px; text-align: left; gap: 1px; }
.sb-recent.is-active { background: var(--hover-2); }
.sb-recent .t { font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.sb-recent.is-active .t { color: var(--ink); }
.sb-recent .m { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
.dot.rec { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); animation: rec-pulse 1.4s ease-in-out infinite; }
.dot.green { background: var(--green); } .dot.amber { background: var(--amber); } .dot.red { background: var(--red); } .dot.accent { background: var(--accent); }
.sb-foot { margin: 12px 8px 0; width: 208px; border-top: 1px solid var(--line); padding-top: 12px; }
.sb-foot button { display: flex; height: 32px; width: 100%; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; background: var(--hover-2); font-size: 12.5px; font-weight: 500; color: var(--ink); transition: background-color 150ms, transform 150ms; }
.sb-foot button:hover { background: var(--line-strong); }
.sb-foot button svg { width: 14px; height: 14px; }

/* tab bar */
.tabbar { display: flex; height: 44px; flex-shrink: 0; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { display: flex; height: 28px; width: 190px; flex-shrink: 0; align-items: center; gap: 2px; padding: 0 2px 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); transition: background-color 100ms, color 100ms; }
.tab:hover { background: var(--hover); color: var(--ink); }
.tab.is-active { background: var(--hover-2); color: var(--ink); }
.tab .t { min-width: 0; flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .dot { margin-right: 7px; }
.tab .x { display: flex; width: 24px; height: 24px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 5px; color: var(--ink-3); }
.tab .x:hover { background: var(--hover-2); color: var(--ink); }
.tab .x svg { width: 11px; height: 11px; }
.tab-plus { display: flex; width: 28px; height: 28px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 7px; color: var(--ink-3); }
.tab-plus:hover { background: var(--hover); color: var(--ink); }
.tab-plus svg { width: 15px; height: 15px; }
.tabbar .spacer { flex: 1; }
.tabbar .right { display: flex; align-items: center; gap: 4px; padding-right: 2px; }

/* ── buttons: pill by default, one filled action per surface ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap; user-select: none; transition: transform 150ms ease-out, background-color 150ms ease-out, opacity 150ms ease-out, color 150ms, filter 150ms; }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.primary { background: var(--ink); color: var(--page); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
.btn.primary:hover { opacity: .9; }
.btn.accent { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.btn.accent:hover { filter: brightness(1.06); }
.btn.secondary { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-btn); }
.btn.secondary:hover { background: var(--hover); }
.btn.ghost { background: var(--hover-2); color: var(--ink); }
.btn.ghost:hover { background: var(--line-strong); }
.btn.quiet { color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); color: var(--ink); }
.btn.danger { background: var(--red-tint); color: var(--red); }
.btn.danger:hover { filter: brightness(1.1); }
.btn.md { height: 34px; padding: 0 16px; font-size: 13.5px; }
.btn.lg { height: 40px; padding: 0 20px; font-size: 14px; }
.btn.xs { height: 26px; padding: 0 10px; font-size: 12px; font-weight: 400; }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn .kbd { margin-left: 2px; height: 18px; }
.btn.accent .kbd { background: rgba(0,0,0,.25); border-color: rgba(0,0,0,.3); color: #fff; }

/* pills, chips, citations */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1; background: var(--inset); color: var(--ink-2); box-shadow: var(--shadow-hairline); white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; }
.pill svg { width: 12px; height: 12px; }
.pill.green { background: var(--green-tint); color: var(--green); box-shadow: none; }
.pill.amber { background: var(--amber-tint); color: var(--amber); box-shadow: none; }
.pill.red { background: var(--red-tint); color: var(--red); box-shadow: none; }
.pill.accent { background: var(--accent-tint); color: var(--accent-ink); box-shadow: none; }
.pill.mono { font-family: var(--font-mono); font-size: 11px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--inset); color: var(--ink-2); font-family: var(--font-mono); font-size: 11px; box-shadow: var(--shadow-hairline); white-space: nowrap; vertical-align: middle; }
.cite { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; margin: 0 2px; border-radius: 5px; background: var(--inset); color: var(--ink-2); font-family: var(--font-mono); font-size: 10.5px; box-shadow: var(--shadow-hairline); vertical-align: middle; transform: translateY(-1px); transition: background-color 150ms, color 150ms; font-variant-numeric: tabular-nums; }
.cite:hover { background: var(--hover-2); color: var(--ink); }
.cite .dot { width: 5px; height: 5px; }
.cite.notes { color: var(--accent-ink); }

/* cards and rows */
.card { border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.card-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.card-bar .t { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
.card-bar .r { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.card-pad { padding: 12px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .l { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .l svg { width: 15px; height: 15px; color: var(--ink-3); flex-shrink: 0; }
.row .v { font-size: 13px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; text-align: right; flex-shrink: 0; }
.row .v .meta { font-size: 12px; font-weight: 400; color: var(--ink-3); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.eyebrow::before { content: ""; width: 14px; height: 1px; background: var(--accent); }
.eyebrow.plain::before { display: none; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* segmented control, switch, options, select, field */
.seg { position: relative; display: inline-grid; height: 32px; padding: 2px; border-radius: 999px; background: var(--field); box-shadow: var(--shadow-hairline); user-select: none; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-btn); transition: transform 200ms var(--ease-out-strong); }
.seg button { position: relative; z-index: 1; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; justify-content: center; transition: color 150ms; }
.seg button.is-on { color: var(--ink); }
.seg button svg { width: 14px; height: 14px; }
.switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; border-radius: 999px; background: var(--line-strong); transition: background-color 200ms; }
.switch.is-on { background: var(--accent); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 200ms var(--ease-out-strong); }
.switch.is-on::after { transform: translateX(16px); }
.opt { display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 6px; border-radius: 8px; text-align: left; width: 100%; transition: background-color 100ms; }
.opt:hover { background: var(--hover); }
.opt .box { display: flex; width: 16px; height: 16px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: transparent; transition: background-color 200ms, color 200ms; }
.opt .box.sq { border-radius: 5px; }
.opt.is-on .box { background: var(--ink); color: var(--page); box-shadow: none; }
.opt .box i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; transform: scale(0); transition: transform 200ms; }
.opt.is-on .box i { transform: scale(1); }
.opt .box svg { width: 11px; height: 11px; }
.opt .txt { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.opt.is-on .txt { color: var(--ink); }
.opt .txt small { display: block; font-size: 11.5px; color: var(--ink-3); }
.select { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-btn); font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; transition: background-color 120ms; }
.select:hover { background: var(--hover); }
.select svg { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; }
.select .ico { color: var(--ink-2); }
.select .lbl { color: var(--ink-3); font-weight: 400; }
.field { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; background: var(--field); box-shadow: var(--shadow-hairline); }
.field input { flex: 1; min-width: 0; background: transparent; border: 0; font-size: 13.5px; color: var(--ink); outline: none; }
.field svg { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; }
.field .hits { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }

/* brand waveform (5 bars, height-only motion) and level meters */
.wave { display: flex; align-items: center; gap: 3px; height: 22px; width: 32px; flex-shrink: 0; }
.wave i { width: 4px; border-radius: 3px; background: linear-gradient(180deg, var(--amber), var(--accent)); transform-origin: center; display: block; }
.wave i:nth-child(1){height:40%} .wave i:nth-child(2){height:75%} .wave i:nth-child(3){height:100%} .wave i:nth-child(4){height:65%} .wave i:nth-child(5){height:45%}
.wave.bounce i { animation: ok-bar-bounce 1.1s ease-in-out infinite; }
.wave.bounce i:nth-child(1){animation-delay:.05s} .wave.bounce i:nth-child(2){animation-delay:.2s} .wave.bounce i:nth-child(3){animation-delay:0s} .wave.bounce i:nth-child(4){animation-delay:.3s} .wave.bounce i:nth-child(5){animation-delay:.12s}
.wave.breathe i { animation: ok-bar-breathe 2.4s ease-in-out infinite; }
.wave.breathe i:nth-child(2){animation-delay:-.84s} .wave.breathe i:nth-child(3){animation-delay:-1.76s} .wave.breathe i:nth-child(4){animation-delay:-.52s} .wave.breathe i:nth-child(5){animation-delay:-1.28s}
.wave.level i { animation: ok-bar-level 0.9s ease-in-out infinite; }
.wave.level i:nth-child(2){animation-delay:-.3s;animation-duration:1.1s} .wave.level i:nth-child(3){animation-delay:-.6s;animation-duration:.8s} .wave.level i:nth-child(4){animation-delay:-.15s;animation-duration:1.05s} .wave.level i:nth-child(5){animation-delay:-.45s;animation-duration:.95s}
.wave.quiet i { animation: ok-bar-breathe 2.4s ease-in-out infinite; }
.wave.flat i { background: var(--line-strong); }
.wave.green i { background: var(--green); } .wave.amber i { background: var(--amber); } .wave.red i { background: var(--red); transform: scaleY(.3); }
.wave.lg { height: 34px; width: 50px; gap: 5px; } .wave.lg i { width: 6px; }
.meter { display: flex; align-items: center; gap: 2px; height: 10px; }
.meter i { width: 4px; height: 100%; border-radius: 1.5px; background: var(--line-strong); display: block; }
.meter i.on { background: var(--accent); }
.meter i.hot { background: var(--amber); }
.meter.muted i.on { background: var(--ink-3); }

/* recording header and source rows */
.rec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.rec-state { display: inline-flex; align-items: center; gap: 10px; }
.rec-state .lbl { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.rec-state .lbl.on { color: var(--accent-ink); }
.rec-state .lbl.paused { color: var(--amber); }
.rec-time { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: .02em; }
.rec-head .grow { flex: 1; }
.src { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-hairline); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.src svg { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; }
.src b { font-weight: 500; color: var(--ink); }
.src.off { opacity: .6; }

/* meeting header, document tabs, document column */
.mt-head { padding: 18px 20px 0; flex-shrink: 0; }
.mt-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--ink); display: flex; align-items: center; gap: 10px; }
.mt-title .icon-btn { opacity: 0; transition: opacity 150ms; }
.mt-head:hover .mt-title .icon-btn { opacity: 1; }
.mt-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
.mt-meta .mono { font-size: 11.5px; }
.mt-meta .sep { width: 1px; height: 12px; background: var(--line-strong); }
.doc-tabs { display: flex; align-items: center; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.doc-tab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-3); transition: color 120ms; }
.doc-tab:hover { color: var(--ink-2); }
.doc-tab.is-active { color: var(--ink); }
.doc-tab.is-active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.doc-tab .badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--inset); box-shadow: var(--shadow-hairline); font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.doc-tab .badge.amber { background: var(--amber-tint); color: var(--amber); box-shadow: none; }
.doc-tab .badge.green { background: var(--green-tint); color: var(--green); box-shadow: none; }
.doc-tab:disabled { opacity: .45; pointer-events: none; }
.doc-tabs .spacer { flex: 1; }
.doc-tabs .tools { display: flex; align-items: center; gap: 2px; padding-bottom: 4px; }
.doc-scroll { min-height: 0; flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.doc { padding: 20px 20px 40px; max-width: 760px; }
.doc.fill { max-width: none; }

/* My thoughts */
.notes-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.notes-bar .grow { flex: 1; min-width: 0; }
.notes-bar .ink-3 { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.autosave { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }
.autosave .dot { width: 5px; height: 5px; background: var(--green); }
.notes { font-size: 15px; line-height: 1.7; color: var(--ink); min-height: 320px; outline: none; }
.notes p { margin: 0 0 4px; }
.notes .ts { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; margin-right: 6px; border-radius: 5px; background: var(--inset); box-shadow: var(--shadow-hairline); font-family: var(--font-mono); font-size: 10.5px; color: var(--accent-ink); vertical-align: middle; transform: translateY(-1px); }
.notes .todo { color: var(--ink-2); }
.notes .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); vertical-align: text-bottom; animation: caret-blink 1s step-end infinite; margin-left: 1px; }

/* Transcript */
.tx-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.tx-tools .field { flex: 1; max-width: 380px; }
.tx-tools .grow { flex: 1; }
.passage { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 0 12px; padding: 8px 8px; margin: 0 -8px; border-radius: 8px; transition: background-color 120ms; }
.passage:hover { background: var(--hover); }
.passage.is-selected { background: var(--accent-tint); }
.passage.is-cited { box-shadow: inset 2px 0 0 var(--accent); }
.passage .ts { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: left; }
.passage .ts:hover { color: var(--accent-ink); }
.passage .who { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.passage .text { font-size: 15px; line-height: 1.6; color: var(--ink); }
.passage .text mark { background: var(--amber-tint); color: inherit; border-radius: 3px; padding: 0 2px; }
.passage .text .fix { background: var(--green-tint); border-radius: 3px; padding: 0 2px; }
.passage .text .del { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--red); }
.passage .rev { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.passage .rev svg { width: 11px; height: 11px; }
.speaker { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 3px; border-radius: 999px; background: var(--field); box-shadow: var(--shadow-hairline); font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.speaker .mg { display: flex; width: 16px; height: 16px; align-items: center; justify-content: center; border-radius: 50%; font-size: 9px; font-weight: 600; color: #fff; }
.speaker.unconfirmed { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); background: transparent; }
.speaker.unconfirmed .mg { background: var(--line-strong) !important; color: var(--ink-2); }
.speaker .src-ico { display: flex; width: 16px; height: 16px; align-items: center; justify-content: center; border-radius: 50%; background: var(--hover-2); color: var(--ink-2); }
.speaker .src-ico svg { width: 10px; height: 10px; }
.speaker .q { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
.sys { display: flex; align-items: center; gap: 8px; margin: 6px 0 6px 64px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.sys.warn { color: var(--amber); }
.sys .line { flex: 1; height: 1px; background: var(--line); }
.sys svg { width: 12px; height: 12px; }
.playbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--page); border-top: 1px solid var(--line); flex-shrink: 0; }
.playbar .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line-strong); position: relative; }
.playbar .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 26%; border-radius: 2px; background: var(--accent); display: block; }
.playbar .track b { position: absolute; top: 50%; left: 26%; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); box-shadow: var(--shadow-btn); }
.playbar .track .gap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--amber); }
.playbar .t { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.playbar .keep { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.selbar { position: absolute; left: 64px; bottom: -32px; z-index: 5; display: flex; align-items: center; gap: 2px; height: 36px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-overlay); animation: pop-in 220ms var(--ease-out-strong) both; }
.selbar .btn { height: 28px; }
.selbar .sep { width: 1px; height: 16px; margin: 0 2px; background: var(--line); }

/* popover menus */
.menu { position: absolute; z-index: 20; width: 250px; padding: 6px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-overlay); animation: pop-in 160ms var(--ease-out-strong) both; transform-origin: top left; }
.menu .lbl { padding: 5px 8px 6px; font-size: 10.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.menu .mi { position: relative; z-index: 1; display: flex; width: 100%; height: 32px; align-items: center; gap: 8px; padding: 0 8px; border-radius: 7px; font-size: 13px; color: var(--ink); text-align: left; }
.menu .mi .ico { display: flex; width: 16px; color: var(--ink-2); flex-shrink: 0; }
.menu .mi .ico svg { width: 15px; height: 15px; }
.menu .mi .r { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.menu .mi .r svg { width: 14px; height: 14px; }
.menu .sepl { height: 1px; background: var(--line); margin: 4px 0; }
.menu .mi.is-checked .r { color: var(--ink); }
.menu .field { margin: 2px 2px 6px; height: 30px; }

/* Summary */
.sum-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 12.5px; color: var(--ink-3); }
.sum-bar .grow { flex: 1; }
.banner { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--amber-tint); color: var(--ink); font-size: 13px; margin-bottom: 16px; }
.banner > svg { width: 16px; height: 16px; color: var(--amber); flex-shrink: 0; margin-top: 2px; }
.banner .body { flex: 1; min-width: 0; } .banner .body b { font-weight: 600; } .banner .body p { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.banner.red { background: var(--red-tint); } .banner.red > svg { color: var(--red); }
.banner.green { background: var(--green-tint); } .banner.green > svg { color: var(--green); }
.banner.neutral { background: var(--inset); box-shadow: var(--shadow-hairline); } .banner.neutral > svg { color: var(--ink-3); }
.banner .acts { display: flex; gap: 6px; flex-shrink: 0; }
.sum h3 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
.sum h3:first-child { margin-top: 0; }
.sum h3 .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }
.sum p.lead { font-size: 15px; line-height: 1.65; color: var(--ink); }
.item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.55; }
.item:last-child { border-bottom: 0; }
.item .mk { display: flex; width: 18px; height: 18px; align-items: center; justify-content: center; margin-top: 3px; border-radius: 50%; color: #fff; }
.item .mk.green { background: var(--green); } .item .mk.amber { background: var(--amber); } .item .mk.neutral { background: var(--line-strong); color: var(--ink-2); } .item .mk.q { background: var(--accent); }
.item .mk svg { width: 11px; height: 11px; }
.item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; font-size: 12px; color: var(--ink-3); }
.tagd { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; }
.tagd.decided { background: var(--green-tint); color: var(--green); } .tagd.suggested { background: var(--inset); color: var(--ink-2); box-shadow: var(--shadow-hairline); } .tagd.deferred { background: var(--amber-tint); color: var(--amber); } .tagd.notes { background: var(--accent-tint); color: var(--accent-ink); }
.owner { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.owner .mg { width: 14px; height: 14px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 600; color: #fff; }
.unassigned { color: var(--amber); }
.sum-actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
.disclosure { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; flex-wrap: wrap; }
.disclosure .pill { height: 18px; font-size: 10px; }

/* loaders, shimmer, thinking traces, task rows */
.shimmer { display: inline-block; background-image: linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer-text 1.4s linear infinite; font-weight: 500; }
.loader { display: inline-grid; grid-template-columns: repeat(3, 4px); gap: 1.5px; flex-shrink: 0; }
.loader i { width: 4px; height: 4px; border-radius: 1px; background: var(--ink); opacity: .15; animation: pixel-on 650ms ease-in-out infinite; display: block; }
.loader.dots i { border-radius: 50%; }
.loader i:nth-child(1){animation-delay:90ms} .loader i:nth-child(2){animation-delay:180ms} .loader i:nth-child(3){animation-delay:270ms} .loader i:nth-child(4){animation-delay:0ms} .loader i:nth-child(5){animation-delay:90ms} .loader i:nth-child(6){animation-delay:180ms} .loader i:nth-child(7){animation-delay:90ms} .loader i:nth-child(8){animation-delay:180ms} .loader i:nth-child(9){animation-delay:270ms}
.loading { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; }
.loading .el { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.think { display: flex; flex-direction: column; }
.think-head { display: inline-flex; width: fit-content; align-items: center; gap: 8px; margin: 0 -6px; padding: 4px 6px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.think-head:hover { background: var(--hover-2); }
.think-head svg { width: 14px; height: 14px; }
.think-head .chev { transition: transform 300ms; color: var(--ink-3); }
.think.is-open .think-head .chev { transform: rotate(180deg); }
.think-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 400ms var(--ease-out-strong), opacity 300ms; }
.think.is-open .think-body { grid-template-rows: 1fr; opacity: 1; }
.think-body > div { overflow: hidden; }
.trace { position: relative; margin: 4px 0 0 5px; padding-left: 16px; }
.trace::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 6px; width: 1px; background: var(--line); }
.trace .tr { display: flex; min-height: 28px; align-items: center; gap: 8px; padding: 2px 6px; border-radius: 6px; font-size: 12.5px; }
.trace .tr:hover { background: var(--hover); }
.trace .tr .chk { width: 14px; height: 14px; color: var(--ink-3); flex-shrink: 0; }
.trace .tr .p { font-weight: 500; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace .tr .s { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); flex-shrink: 0; margin-left: auto; }

function ico(name, size = 15, sw = 1.8) {
  const filled = ['play', 'pause', 'stop', 'sparkle', 'more', 'moon'].includes(name);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="${filled ? 'none' : 'currentColor'}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ── small building blocks ─────────────────────────────── */
const wave = (cls = '') => `<span class="wave ${cls}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>`;
function meter(on, total = 14, hot = 0, cls = '') {
  let s = '';
  for (let i = 0; i < total; i++) s += `<i class="${i < on ? (i >= total - hot ? 'hot' : 'on') : ''}"></i>`;
  return `<span class="meter ${cls}" aria-hidden="true">${s}</span>`;
}
const pill = (text, tone = '', dot = true) => `<span class="pill ${tone}">${dot ? '<span class="dot"></span>' : ''}${text}</span>`;
const chip = (text) => `<span class="chip">${text}</span>`;

function ring(pct, label, spin = false) {
  const r = 10, c = 2 * Math.PI * r;
  return `<span class="ring ${spin ? 'spin-ring' : ''}"><svg width="24" height="24"><circle cx="12" cy="12" r="${r}" fill="none" stroke="var(--line-strong)" stroke-width="2"/><circle cx="12" cy="12" r="${r}" fill="none" stroke="${spin ? 'var(--ink-3)' : 'var(--accent)'}" stroke-width="2" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}"/></svg><span>${label}</span></span>`;
}

}

        ${state('hdd', 'amber', 'Disk full or write error', '27:31', 'Capture stopped persisting at 27:31. Completed chunks up to 27:26 are safe. The gap is marked on the timeline.', btn('Free space and retry', 'secondary xs', 'refresh'))}
        ${state('cpu', 'amber', 'Model missing or inference failure', 'after Stop', 'Orukeet is not installed on this PC. The meeting is kept; transcription waits. Ownkey did not download anything and did not fall back to a cloud model.', btn('Set up model', 'secondary xs', 'layers') + btn('Retry', 'quiet xs', 'refresh'))}
        ${state('users', 'amber', 'Speaker labels failed', 'rev 2', 'The diarization worker exited. The transcript is kept with Microphone / Call audio labels. Retry speaker labelling on its own.', btn('Retry speaker labels', 'secondary xs', 'refresh'))}
        ${state('wifiOff', 'red', 'Text provider outage or expired key', 'summary', 'OpenRouter returned 503. Transcript and notes are unchanged. The summary can be retried independently; nothing was cut off.', btn('Retry summary', 'secondary xs', 'refresh') + btn('Change provider', 'quiet xs', 'sliders'))}
        ${state('refresh', 'green', 'Cancelled or restarted during processing', 'job 3 of 5', 'Resumed from committed jobs. No duplicate passages, no overwritten corrections.', pill('Idempotent', 'green'))}
        ${state('alert', 'amber', 'Buffer overrun', '0.8 s', 'A gap is shown in the transcript and on the playback track. It cannot become silent data loss.', pill('Visible gap', 'amber'))}
      </div>
    </div>
  </div>`;
  const task = (badge, label, sub, amt) => `<div class="task"><span class="badge">${badge}</span><span class="lbl">${label}<small>${sub}</small></span><span class="amt">${amt}</span></div>`;
  const side = {
    title: `${ico('undo', 14)} Recovery`,
    body: `
      <div class="tasks jobs">
        ${task('<span class="b green">' + ico('check', 12, 3.5) + '</span>', 'Reconcile chunks', '502 durable · 1 orphan discarded', '41:52')}
        ${task('<span class="b green">' + ico('check', 12, 3.5) + '</span>', 'Restore notes', 'Autosave rev 9 · 41:50', 'ok')}
        ${task('<span class="b amber">' + ico('alert', 12, 2.6) + '</span>', 'Tail of recording', 'Lost between last commit and crash', '4 s')}
        ${task('<span class="b neutral">' + ico('clock', 12, 2.2) + '</span>', 'Transcription', 'Waits for your action', '—')}
      </div>
      <div class="card card-pad" style="margin-top:12px">
        <div class="row"><span class="l">Recovery audio</span><span class="v"><span class="tnum">301 MB</span><span class="meta">kept until processed or deleted</span></span></div>
        <div class="row"><span class="l">Retention rule</span><span class="v"><span class="meta">7 days after a successful transcription</span></span></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:12px">${btn('Process now', 'primary', 'play')}${btn('Delete meeting', 'danger', 'trash')}</div>`,
  };
  return shell({ sb: { activeRecent: 'Klantgesprek Van Dijk Logistics' }, tabs: [DEFAULT_TABS[0], { t: 'Klantgesprek Van Dijk Logistics', dot: 'amber' }], activeTab: 1, main, side });
}

          ${srow('Durable chunks', 'Audio is committed to disk in short chunks; a crash loses at most this much', chip('5 s'))}
          ${srow('During a meeting', 'Dictation and rewrite hotkeys show the meeting status instead of recording', pill('Meeting owns the devices', '', false))}

      <section>${eyebrow('Storage and retention')}

          ${srow('Alternative · sherpa-onnx diarization', 'Same runtime as Orukeet; separate segmentation and embedding models. Under evaluation.', pill('Evaluation', 'amber'))}
          ${srow('Downloads', 'Only when you ask. Never on failure, never as a cloud fallback.', pill('Explicit', 'green'))}

  return shell({ sb: { nav: 'settings', activeRecent: '' }, tabs: [...DEFAULT_TABS, { t: 'Settings', dot: '' }], activeTab: 2, main });
}

/* ═══ router, captions, interactions ══════════════════════ */
const SCREENS = [
  { id: 'library',    n: '01', title: 'Library',          render: screenLibrary,    cap: 'Meetings opens from the tray and lands here. Title is optional, sources are explicit, and nothing is saved before Start.', spec: 'Start and capture 1–4' },
  { id: 'new',        n: '02', title: 'New meeting',      render: screenNew,        cap: 'Sources, devices, live meters, capture scope, storage, model readiness and the retention choice, all before the first byte is written. A missing model never downloads itself.', spec: 'Start and capture 2–5' },
  { id: 'recording',  n: '03', title: 'Recording',        render: screenRecording,  cap: 'Indicator, elapsed time, per-source meters, Pause and Stop. Notes are typed while it runs; the transcript waits for Stop. Every gap and pause is a visible timeline event.', spec: 'Start and capture 6' },
  { id: 'minimized',  n: '04', title: 'Minimized',        render: screenMinimized,  cap: 'Closing the window minimizes it while capture continues. Quitting asks: Stop and save, or Keep recording. Dictation hotkeys show the meeting status.', spec: 'Start and capture' },
  { id: 'processing', n: '05', title: 'After Stop',       render: screenProcessing, cap: 'Transcription progress after Stop, in order, with completed passages usable early. Speaker labels are skipped without the optional model. Nothing goes to the cloud on its own.', spec: 'Review one meeting' },
  { id: 'thoughts',   n: '06', title: 'My thoughts',      render: screenThoughts,   cap: 'Editable, autosaved notes with optional timestamps that open the transcript. AI never writes here, and notes stay out of AI context unless you opt in.', spec: 'Review one meeting · My thoughts' },
  { id: 'transcript', n: '07', title: 'Transcript',       render: screenTranscript, cap: 'Timed passages with source or speaker labels, search, corrections as their own revision, rename everywhere or reassign one passage, and playback while audio is retained.', spec: 'Review one meeting · Transcript' },
  { id: 'summary',    n: '08', title: 'Summary',          render: screenSummary,    cap: 'Overview, decisions, action items and unresolved questions. Every factual item cites passages; decided, suggested and deferred are kept apart; owners stay unassigned; edits mark it outdated.', spec: 'Review one meeting · Summary' },
  { id: 'ask',        n: '09', title: 'Ask',              render: screenAsk,        cap: 'An explicit action. Answers cite passage IDs that were checked against this revision, say so when the record cannot answer, and keep notes out unless switched on.', spec: 'Summarize, ask and draft' },
  { id: 'draft',      n: '10', title: 'Follow-up',        render: screenDraft,      cap: 'An editable draft with Copy and Export. No send action, no tool execution. Missing owners stay missing in the draft too.', spec: 'Summarize, ask and draft' },
  { id: 'consent',    n: '11', title: 'Disclosure',       render: screenConsent,   cap: 'Before the first remote analysis: the provider, what is sent, what is not, and a remembered policy. Audio never leaves the device on this flow.', spec: 'Summarize, ask and draft' },
  { id: 'export',     n: '12', title: 'Export',           render: screenExport,     cap: 'Markdown or text with separate sections, JSON with IDs, revisions and speaker mappings. Delete cancels jobs, removes everything, and says what it cannot promise.', spec: 'Storage, trust and recovery' },
  { id: 'failures',   n: '13', title: 'Failures',         render: screenFailures,   cap: 'The recovery table, made visible: crash, device loss, disk full, missing model, diarization failure, provider outage, restart. Nothing switches to the cloud by itself.', spec: 'Storage, trust and recovery' },
  { id: 'settings',   n: '14', title: 'Settings',         render: screenSettings,   cap: 'A meeting-specific text model, local vs remote in the open, auto-summary, retention default, library location, explicit model downloads and protected credentials.', spec: 'Summarize, ask and draft · Storage' },
  { id: 'tray',       n: '15', title: 'Tray',             render: screenTray,       cap: 'The tray entry point, live controls for a running meeting, and the brand pill states used during meetings.', spec: 'Start and capture · Overlay spec' },
];
let current = 0;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function render(i) {
  current = (i + SCREENS.length) % SCREENS.length;
  const s = SCREENS[current];
  const stage = $('#stage');
  stage.innerHTML = s.render();
  $('#caption').innerHTML = `<span class="tag">${s.n} · ${s.title}</span><span class="txt"><b>Spec · ${s.spec}.</b> ${s.cap}</span>`;
  $$('.screen-pill').forEach((el, idx) => el.classList.toggle('is-active', idx === current));
  const active = $('.screen-pill.is-active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
  location.hash = s.id;
  bind(stage);
}
function go(id) { const idx = SCREENS.findIndex((s) => s.id === id); if (idx >= 0) render(idx); }

function bind(root) {
  /* one hover layer glides between rows (Beautiful UI's GlideMenu) */
  $$('.glide', root).forEach((g) => {
    const hl = $('.glide-hl', g);
    g.addEventListener('mouseover', (e) => {
      const row = e.target.closest('[data-row]');
      if (!row || !g.contains(row)) return;
      const gr = g.getBoundingClientRect(), rr = row.getBoundingClientRect();
      hl.style.top = `${rr.top - gr.top}px`; hl.style.height = `${rr.height}px`; hl.style.opacity = '1';
    });
    g.addEventListener('mouseleave', () => { hl.style.opacity = '0'; });
  });
  $$('[data-collapse]', root).forEach((b) => b.addEventListener('click', () => b.closest('.sidebar').classList.toggle('is-collapsed')));
  $$('[data-think]', root).forEach((b) => b.addEventListener('click', () => b.closest('.think').classList.toggle('is-open')));
  $$('.switch', root).forEach((b) => b.addEventListener('click', () => { b.classList.toggle('is-on'); b.setAttribute('aria-checked', b.classList.contains('is-on')); }));
  $$('[data-check]', root).forEach((b) => b.addEventListener('click', () => b.classList.toggle('is-on')));
  $$('[data-opt]', root).forEach((b) => b.addEventListener('click', () => { $$('[data-opt]', b.parentElement).forEach((o) => o.classList.remove('is-on')); b.classList.add('is-on'); }));
  $$('.seg', root).forEach((seg) => {
    const buttons = $$('button', seg), thumb = $('.thumb', seg);
    buttons.forEach((b, i) => b.addEventListener('click', () => { buttons.forEach((o) => o.classList.remove('is-on')); b.classList.add('is-on'); thumb.style.transform = `translateX(${i * 100}%)`; }));
  });
  /* navigation inside the mock: document tabs, sidebar rail, + tab */
  $$('[data-doctab]', root).forEach((b) => b.addEventListener('click', () => go(b.dataset.doctab)));
  $$('[data-nav]', root).forEach((b) => b.addEventListener('click', () => { const map = { new: 'new', meetings: 'library', settings: 'settings', models: 'settings' }; go(map[b.dataset.nav]); }));
  $$('.tab-plus', root).forEach((b) => b.addEventListener('click', () => go('new')));
  $$('.sb-recent', root).forEach((b) => b.addEventListener('click', () => {
    const t = b.title || '';
    if (t.startsWith('Weekly')) go('recording'); else if (t.startsWith('Klant')) go('failures'); else if (t.startsWith('Kickoff')) go('summary');
  }));
  $$('.cite', root).forEach((c) => c.addEventListener('click', () => {
    const id = c.dataset.p;
    if (current !== SCREENS.findIndex((s) => s.id === 'transcript') && current !== SCREENS.findIndex((s) => s.id === 'ask')) go('ask');
    const target = $(`.passage[data-id="${id}"]`);
    if (target) { $$('.passage.is-cited').forEach((p) => p.classList.remove('is-cited')); target.classList.add('is-cited'); target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }));
  $$('.composer textarea', root).forEach((ta) => ta.addEventListener('input', () => { const send = $('.send', ta.closest('.composer')); send.classList.toggle('off', ta.value.trim().length === 0); }));
}

function setTheme(dark) {
  const rootEl = document.documentElement;
  rootEl.classList.add('theme-switching');
  rootEl.classList.toggle('dark', dark); rootEl.classList.toggle('light', !dark);
  $('#theme-dark').classList.toggle('is-on', dark); $('#theme-light').classList.toggle('is-on', !dark);
  requestAnimationFrame(() => requestAnimationFrame(() => rootEl.classList.remove('theme-switching')));
  try { localStorage.setItem('ownkey-mock-theme', dark ? 'dark' : 'light'); } catch (e) {}
}

function boot() {
  $('#brand').innerHTML = `${keycap(22)}<span>ownkey</span><small>Meetings · UI mockup · 16 Sep 2026</small>`;
  document.title = 'Ownkey Meetings — interface mockup';
  $('#screens').innerHTML = SCREENS.map((s, i) => `<button type="button" class="screen-pill" data-i="${i}"><span class="n">${s.n}</span>${s.title}</button>`).join('');
  $$('.screen-pill').forEach((b) => b.addEventListener('click', () => render(Number(b.dataset.i))));
  $('#theme-light').innerHTML = ico('sun', 13, 2.4); $('#theme-dark').innerHTML = ico('moon', 13);
  $('#theme-light').addEventListener('click', () => setTheme(false));
  $('#theme-dark').addEventListener('click', () => setTheme(true));
  let dark = true;
  try { dark = localStorage.getItem('ownkey-mock-theme') !== 'light'; } catch (e) {}
  const wanted = new URLSearchParams(location.search).get('theme');
  if (wanted === 'light' || wanted === 'dark') dark = wanted === 'dark';
  setTheme(dark);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') render(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') render(current - 1);
    if (e.key === 't') setTheme(!document.documentElement.classList.contains('dark'));
  });
  const start = SCREENS.findIndex((s) => s.id === location.hash.slice(1));
  render(start >= 0 ? start : 0);
}
boot();
</script>
